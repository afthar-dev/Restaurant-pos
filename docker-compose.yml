name: rpos-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpos
      POSTGRES_PASSWORD: rpos
      POSTGRES_DB: rpos_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rpos -d rpos_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
