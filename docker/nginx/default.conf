server {
  listen 80;
  server_name _;
  client_max_body_size 5m;

  # Resolve the api container through Docker's DNS at request time, not once at startup.
  # nginx then starts even while api is down (staff still get the app with "Server offline"),
  # and follows api to its new IP after a container recreate.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Hashed build assets: never fall back to index.html (a stale page asking for an old
  # hash must get a 404, not HTML), and cache forever since the name changes per build.
  location /qr/assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    root /usr/share/nginx/html/web;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /qr/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /qr/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    root /usr/share/nginx/html/web;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
